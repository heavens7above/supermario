[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supermario"
version = "0.1.0"
description = "A simple Super Mario clone in Python with Pygame"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
  {name = "MasterSam", email = "sam@example.com"},
]
dependencies = [
  "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "flake8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supermario"]
